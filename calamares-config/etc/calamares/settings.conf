# ClaudeOS Calamares settings (Calamares 3.3.14 as shipped in Ubuntu 26.04.1).
# UX: Language (welcome) -> Timezone (locale) -> Disk (partition) -> Account (users) -> Install (summary).
# The keyboard page is intentionally absent; see README ("Keyboard layout").
---
modules-search: [ local ]

instances:
  - id: preinstall
    module: shellprocess
    config: shellprocess_preinstall.conf
  - id: postinstall
    module: shellprocess
    config: shellprocess_postinstall.conf

sequence:
  - show:
      - welcome
      - locale
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - shellprocess@preinstall
      - initramfs
      - grubcfg
      - bootloader
      - shellprocess@postinstall
      - umount
  - show:
      - finished

branding: claudeos
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: false
quit-at-end: false
