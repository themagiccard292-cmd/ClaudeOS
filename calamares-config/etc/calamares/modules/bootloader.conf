# efiBootloaderId MUST stay "ubuntu": Ubuntu's Secure-Boot chain (shim-signed + signed grub) is
# hard-wired to \EFI\ubuntu. kernel/img keys only apply to systemd-boot/refind and are not used.
---
efiBootLoader: "grub"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
efiBootloaderId: "ubuntu"
installEFIFallback: true
