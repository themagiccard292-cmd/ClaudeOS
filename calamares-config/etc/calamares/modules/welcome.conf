# The Language page IS the welcome page: only a language picker plus requirement checks.
---
showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false
showDonateUrl: false

requirements:
  requiredStorage: 15
  requiredRam: 2
  check:
    - storage
    - ram
    - root
  required:
    - storage
    - ram
    - root

# No network lookups during install.
geoip:
  style: "none"
  url: "https://geoip.ubuntu.com/lookup"
  selector: "CountryCode"
