# keep_distributor: Ubuntu's /etc/default/grub derives GRUB_DISTRIBUTOR from os-release; we must not
# overwrite it, so grub-install's default EFI id stays consistent with the packaged signed grub.
---
overwrite: false
prefer_grub_d: false
keep_distributor: true
kernel_params: [ "quiet", "splash" ]
defaults:
  GRUB_TIMEOUT: 5
  GRUB_DEFAULT: "0"
