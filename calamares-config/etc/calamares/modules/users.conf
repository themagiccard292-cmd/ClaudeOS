---
defaultGroups:
  - adm
  - cdrom
  - dip
  - name: lpadmin
    must_exist: false
    system: true
  - plugdev
  - name: sambashare
    must_exist: false
    system: true
  - sudo
sudoersGroup: sudo
sudoersConfigureWithGroup: false

setRootPassword: false
displayAutologin: true      # honoured by newer Calamares; 3.3.14 always shows the box
doAutologin: false

passwordRequirements:
  minLength: 8
  maxLength: -1
  libpwquality:
    - minlen=8
    - maxrepeat=3
    - maxsequence=3
    - usersubstr=4
    - badwords=claudeos
allowWeakPasswords: false
allowWeakPasswordsDefault: false

user:
  shell: /bin/bash
  # "ubuntu" is the casper live user; postinstall.sh deletes a leftover one, so it must not be chosen.
  forbidden_names:
    - root
    - ubuntu
    - daemon
    - bin
    - sys
    - sync
    - games
    - man
    - lp
    - mail
    - news
    - uucp
    - proxy
    - www-data
    - backup
    - list
    - irc
    - nobody
    - gdm
    - messagebus
    - syslog
    - polkitd
    - installer

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "claudeos"
  forbidden_names: [ localhost ]

allowActiveDirectory: false
