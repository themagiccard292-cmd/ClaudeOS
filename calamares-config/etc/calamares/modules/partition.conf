# One-click "Erase disk" flow. NOTE: the stock page label reads "Erase disk"; the
# description text is built from branding strings (productName), so it reads
# "Erase disk ... and install ClaudeOS". The label itself cannot be changed by config.
---
efi:
  mountPoint: "/boot/efi"
  recommendedSize: 512MiB
  minimumSize: 256MiB
  label: "EFI"

initialPartitioningChoice: erase
# Single swap choice => no swap UI; swap partition sized from RAM (<= 8 GiB, <= 10% of disk).
userSwapChoices:
  - small
initialSwapChoice: small

defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4"]

# GPT everywhere. createHybridBootloaderLayout adds a 8 MiB bios_grub partition so BIOS
# firmware can boot GPT disks (Calamares only adds it in hybrid mode).
defaultPartitionTableType: gpt
createHybridBootloaderLayout: true

enableLuksAutomatedPartitioning: false
allowManualPartitioning: true
drawNestedPartitions: false
alwaysShowPartitionLabels: true

partitionLayout:
  - name: "claudeos"
    filesystem: unknown
    mountPoint: "/"
    size: 100%
