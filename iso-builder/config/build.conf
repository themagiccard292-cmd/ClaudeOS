# shellcheck shell=bash
# ClaudeOS ISO build configuration. Sourced by scripts/build-iso.sh (and the unit tests).
# Every value can be overridden from the environment; the defaults below describe the
# 26.04.1 release that docs/ARCHITECTURE.md §1.1 was verified against.

: "${ISO_VERSION:=26.04.1}"
: "${ISO_ARCH:=amd64}"
: "${UBUNTU_RELEASES_URL:=https://releases.ubuntu.com}"

# Product naming for the output image.
: "${PRODUCT_NAME:=ClaudeOS}"

# casper layer that becomes the root of the merged filesystem. Its parents are derived the way
# casper itself does it (strip the last dot-suffix): minimal.standard.live -> minimal.standard -> minimal.
: "${ROOTFS_TOP_LAYER:=minimal.standard.live}"

# Free space required in the work dir (GB): 6 GB ISO copy + ~12 GB merged rootfs + packages + new squashfs
# + output ISO, with headroom for apt caches.
: "${MIN_FREE_GB:=45}"

# squashfs settings. SQUASHFS_COMP=zstd (default, fast to decompress) or xz (smaller, slower).
: "${SQUASHFS_COMP:=zstd}"
: "${SQUASHFS_ZSTD_LEVEL:=19}"
: "${SQUASHFS_BLOCK_SIZE:=1M}"

# GPG: fingerprints of the "Ubuntu CD Image Automatic Signing Key" keys that sign SHA256SUMS.
#   843938DF228D22F7B3742BC0D94AA3F0EFE21092  (2012 key) - on 2026-11-25 this key's issuer fingerprint was read
#       from the real 26.04.1 SHA256SUMS.gpg and the signature verified with the key served by keyserver.ubuntu.com.
#   C5986B4F1257FFA86632CBA746181433FBB75451  (2004 key) - older key, still listed by Ubuntu; from best knowledge.
# VERIFY BEFORE RELEASE: re-check both against https://ubuntu.com/tutorials/how-to-verify-ubuntu out of band.
: "${UBUNTU_SIGNING_FPRS:=843938DF228D22F7B3742BC0D94AA3F0EFE21092 C5986B4F1257FFA86632CBA746181433FBB75451}"
: "${UBUNTU_KEYSERVER:=https://keyserver.ubuntu.com}"
# Optional pre-fetched armored key file(s) (space separated). When set, the keyserver is not contacted.
: "${UBUNTU_KEY_FILES:=}"

# Node.js: Claude Code needs node >= 22. If the archive's candidate is older, the build packages the
# official nodejs.org tarball (SHA256-verified) as the local deb `claudeos-nodejs` (Provides: nodejs, npm).
: "${NODE_MIN_MAJOR:=22}"
: "${NODE_FALLBACK_VERSION:=22.23.4}"
: "${NODE_FALLBACK_SHA256:=1805bcd35e6815559bd2eb97db438d3fdb0eb3a5e6a977b7c1badca76337e9ce}"
: "${NODE_DIST_URL:=https://nodejs.org/dist}"

# Snap(s) of the stock installer that are removed from the live seed.
: "${STOCK_INSTALLER_SNAPS:=ubuntu-desktop-bootstrap}"

# Pinned SHA256 of the upstream ISO, per version. The build fails if the published SHA256SUMS disagrees
# with the pinned value (or if no pin exists) unless ALLOW_UNPINNED=1.
pinned_sha256_for() {
  case "$1" in
    26.04.1) printf '%s\n' 601e30fbf5d97759367c632e2c33630665039b7e2158fd068403da3ccf1bda1f ;;
    *) return 1 ;;
  esac
}
